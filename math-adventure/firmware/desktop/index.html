<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESP32 · 电脑预览</title>
<style>*{box-sizing:border-box}body{margin:0;background:#edf2e9;color:#294735;font:15px system-ui,sans-serif}main{max-width:850px;margin:50px auto;padding:24px}h1{font-size:24px}p{line-height:1.8;color:#647963}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:20px 0}button,select{font:inherit;padding:10px 16px;border:1px solid #cad9c6;border-radius:12px;background:white;color:#294735}button{cursor:pointer}canvas{display:block;width:640px;max-width:100%;height:auto;aspect-ratio:4/3;touch-action:none;background:#fffaee;border:12px solid #253b32;border-radius:15px;box-shadow:0 18px 50px #263c3220}small{color:#768871}#status{white-space:pre-wrap;color:#9c492e}</style>
<main><small>MATH ADVENTURE / DESKTOP</small><h1>把冒险岛放到电脑上</h1><p>复用固件绘图与页面交互代码 · 320 × 240 · 本地试玩<br>鼠标点击屏幕按钮模拟触摸，不连接邮箱、真实设备或正式数据库。</p><div class="toolbar"><label>缩放 <select id="scale"><option value="1">1× 原始尺寸</option><option value="2" selected>2×</option><option value="3">3×</option></select></label><button id="reset">重置本地试玩</button><label><input id="bounds" type="checkbox"> 显示触摸区域</label></div><canvas id="screen" width="320" height="240" aria-label="ESP32屏幕预览，用鼠标点击按钮操作"></canvas><p id="status" role="status"></p><p>修改 src/screen_ui.h 或 src/screen_primitives.h 后，停止并重新运行预览。中文使用电脑字体近似显示；屏幕颜色、字体点阵、触摸校准和刷新性能仍需真机确认。</p></main>
<script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');let current,busy=false;
function color(c){return `rgb(${Math.round(((c>>11)&31)*255/31)},${Math.round(((c>>5)&63)*255/63)},${Math.round((c&31)*255/31)})`;}
function draw(){if(!current)return;ctx.clearRect(0,0,320,240);ctx.lineWidth=1;
for(const [type,...a] of current.commands){
if(type==='text'){ctx.fillStyle=color(a[2]);ctx.font='16px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textBaseline='alphabetic';ctx.fillText(a[3],a[0],a[1]);continue;}
ctx.fillStyle=ctx.strokeStyle=color(a[a.length-1]);ctx.beginPath();
if(type==='fillRect')ctx.fillRect(...a.slice(0,4));
if(type==='roundRect'){ctx.roundRect(...a.slice(0,5));ctx.fill();}
if(type==='circle'){ctx.arc(a[0],a[1],a[2],0,Math.PI*2);ctx.fill();}
if(type==='triangle'){ctx.moveTo(a[0],a[1]);ctx.lineTo(a[2],a[3]);ctx.lineTo(a[4],a[5]);ctx.closePath();ctx.fill();}
if(type==='line'){ctx.moveTo(a[0]+.5,a[1]+.5);ctx.lineTo(a[2]+.5,a[3]+.5);ctx.stroke();}
}
if(document.querySelector('#bounds').checked){ctx.strokeStyle='#e3416d';ctx.setLineDash([3,2]);for(const b of current.buttons)ctx.strokeRect(b.x+.5,b.y+.5,b.w,b.h);ctx.setLineDash([]);}}
async function frame(payload={}){if(busy)return;busy=true;try{const r=await fetch('/frame',{method:'POST',headers:{'Content-Type':'application/json','X-Preview':'1'},body:JSON.stringify(payload)});if(!r.ok)throw Error('预览请求失败，请检查终端');current=await r.json();document.querySelector('#status').textContent='';draw();}catch(e){document.querySelector('#status').textContent=e.message;}finally{busy=false;}}
canvas.onclick=e=>{const r=canvas.getBoundingClientRect(),style=getComputedStyle(canvas),border=parseFloat(style.borderLeftWidth);const x=Math.floor((e.clientX-r.left-border)/(r.width-2*border)*320),y=Math.floor((e.clientY-r.top-border)/(r.height-2*border)*240);if(x>=0&&x<320&&y>=0&&y<240)frame({x,y});};
document.querySelector('#reset').onclick=()=>frame({reset:true});document.querySelector('#bounds').onchange=draw;document.querySelector('#scale').onchange=e=>canvas.style.width=(320*Number(e.target.value)+24)+'px';frame();
</script></html>
