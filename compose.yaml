services:
  gray-data-permissions:
    build:
      context: ./server
    container_name: gray-data-permissions
    user: "0:0"
    restart: "no"
    command: ["sh", "-c", "mkdir -p /data && chown -R 10001:10001 /data"]
    volumes:
      - ./server/data:/data

  gray-service:
    build:
      context: ./server
    container_name: gray-service
    restart: unless-stopped
    network_mode: host
    env_file:
      - ./server/.env
    environment:
      DATABASE_PATH: /data/gray.db
      FIREBASE_SERVICE_ACCOUNT_FILE: /run/secrets/firebase-service-account.json
      # The service uses the host network, so this reaches Ubuntu's CUPS
      # daemon rather than the printer's unreliable embedded IPP endpoint.
      CUPS_SERVER: 127.0.0.1:631
      CUPS_PRINTER: ${CUPS_PRINTER:-HP_DeskJet_2700_series_CB7F78}
      HTTP_PROXY: http://127.0.0.1:7890
      HTTPS_PROXY: http://127.0.0.1:7890
      http_proxy: http://127.0.0.1:7890
      https_proxy: http://127.0.0.1:7890
    command: ["uvicorn", "app.main:app", "--host", "127.0.0.1", "--port", "8787", "--proxy-headers"]
    volumes:
      - ./server/data:/data
    secrets:
      - source: firebase_service_account
        target: firebase-service-account.json
    depends_on:
      gray-data-permissions:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8787/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

secrets:
  firebase_service_account:
    file: ./server/private/firebase-service-account.json
