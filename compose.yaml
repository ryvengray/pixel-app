services:
  gray-service:
    build:
      context: ./server
    container_name: gray-service
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      DATABASE_PATH: /data/gray.db
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./server/data:/data
      # Optional Firebase service account: server/private/firebase-service-account.json
      - ./server/private:/run/gray:ro
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8787/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
