<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E1002 · 独立版设计</title>
<style>
* { box-sizing: border-box; }
:root { font: 16px/1.5 "Instrument Sans", system-ui, sans-serif; color: #252823; background: #eeeee7; }
body { margin: 0; }
main { max-width: 1220px; margin: 0 auto; padding: 36px 24px; }
h1, h2, p { margin: 0; }
h1 { font-size: clamp(24px, 3.5vw, 36px); letter-spacing: -.045em; }
header p, .hint { color: #575e56; font-size: 14px; }
.layout { display: grid; grid-template-columns: minmax(0, 800px) minmax(255px, 1fr); gap: 24px; align-items: start; margin-top: 24px; }
.frame { container-type: inline-size; aspect-ratio: 5/3; border-radius: 5px; overflow: hidden; background: white; box-shadow: 0 0 0 1px #d8dad2, 0 14px 30px #222a2417; }
.screen { --ink: #141412; --blue: #20438b; --red: #ac282d; --yellow: #edc63c; --green: #32734a; position: relative; height: 100%; overflow: hidden; font-size: 1cqw; color: var(--ink); background: #fff; }
[hidden] { display: none !important; }
#calendar, #picture, #setup { position: absolute; inset: 0; }
#calendar { color: var(--ink); background: #fff; }
.date-summary { position: absolute; top: 4cqw; left: 5cqw; width: 25cqw; display: grid; justify-items: start; }
.month-heading { display: flex; align-items: baseline; gap: .38em; font: 750 3.2em/1 "Instrument Sans", system-ui, sans-serif; }
.date-summary strong { display: block; margin: .1em 0 .12em -.045em; font: 800 13.25em/.93 "Instrument Sans", system-ui, sans-serif; letter-spacing: -.075em; font-variant-numeric: tabular-nums; }
.date-summary .weekday-chip { min-width: 7em; padding: .26em .65em; text-align: center; color: white; background: var(--blue); border-radius: .52em; font-size: 2.15em; font-weight: 800; letter-spacing: .16em; }
.date-summary small { margin-top: .75em; font-size: 1.72em; font-weight: 650; white-space: nowrap; }
.calendar-quote { border-top: .15em solid var(--blue); margin-top: .85em; padding-top: .65em; font-size: 1.9em; font-weight: 650; line-height: 1.45; letter-spacing: .05em; }
.landscape { position: absolute; inset: auto auto 0 0; width: 36em; height: 20em; }
.month-card { position: absolute; inset: 3.1em 2.8em 3.1em 33.3em; display: grid; grid-template-rows: auto minmax(0, 1fr); padding: 1.8em; background: white; border: .125em solid var(--blue); border-radius: 2em; }
.calendar-title { font-size: 2.9em; line-height: 1.2; font-weight: 750; margin: .1em .2em .5em; }
.calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-template-rows: 4em repeat(var(--weeks, 6), minmax(0, 1fr)); }
.weekday, .day { display: grid; align-content: center; justify-items: center; }
.weekday { color: white; background: var(--blue); font-size: 1.8em; font-weight: 800; }
.weekday:nth-child(1) { border-radius: .65em 0 0 .65em; }
.weekday:nth-child(7) { border-radius: 0 .65em .65em 0; }
.weekday.weekend { background: var(--red); }
.day { position: relative; gap: .28em; border-bottom: .125em dotted var(--blue); }
.day:nth-last-child(-n+7) { border-bottom: 0; }
.day .number { font: 750 2.55em/1 "Instrument Sans", system-ui, sans-serif; font-variant-numeric: tabular-nums; }
.day.weekend .number { color: var(--red); }
.day .lunar { font-size: 1.4em; line-height: 1; font-weight: 650; }
.day .lunar.month-start { color: var(--blue); font-weight: 800; }
.day .lunar.festival { color: var(--red); font-weight: 800; }
.day.outside .number { color: var(--blue); font-size: 2.15em; font-weight: 500; }
.day.outside .lunar { color: var(--blue); font-weight: 500; }
.day.current::before { content: ""; position: absolute; inset: .32em .2em; background: var(--blue); border-radius: .95em; }
.day.current > :is(.number, .lunar) { position: relative; color: white; }
.upload-qr { position: absolute; bottom: 0; left: 0; display: block; width: 20em; aspect-ratio: 1; background: #fff; }
.device-statusbar { position:absolute; top:1em; right:1em; height:4em; width:13.75em; display:flex; align-items:center; justify-content:space-evenly; background:white; border-radius:.6em; z-index:2; }
.device-statusbar svg { width:3em; height:3em; }
.device-statusbar span { font-size:1.4em; }
.device-statusbar .lamp { fill:white; stroke:var(--ink); stroke-width:1.5; }
.device-statusbar[data-running="true"] .lamp { fill:var(--green); }

#picture canvas { display: block; width: 100%; height: 100%; }
.setup-body { position: absolute; inset: 6em 6em 6em 6em; display: grid; grid-template-columns: 1fr 22em; align-items: center; gap: 5em; }
.setup-copy { border-block: .3em solid var(--ink); padding: 4em 0; }
.setup-copy h2 { font-size: 5.4em; line-height: 1.1; color: var(--blue); margin-bottom: .4em; }
.setup-copy p { font-size: 2.25em; margin: .55em 0; }
.setup-copy small { font-size: 1.8em; }
.setup-qr { text-align: center; font-size: 1em; }
.setup-qr img { display: block; width: 22em; }
.setup-qr strong { font-size: 2em; }
.keys { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 10px; }
button, input { font: inherit; }
button { appearance: none; border: 1px solid #c9cec3; background: #fff; color: #232c25; border-radius: 7px; padding: 7px 11px; cursor: pointer; }
button.primary { background: #253f36; color: white; border-color: #253f36; }
button:disabled { opacity: .48; cursor: default; }
button:focus-visible, input:focus-visible { outline: 2px solid #20438b; outline-offset: 2px; }
aside { border: 1px solid #d7d9cc; border-radius: 12px; background: #fafbf6; padding: 19px; }
aside h2 { font-size: 19px; margin-bottom: 6px; }
aside .hint { margin-bottom: 14px; }
aside label { display: grid; gap: 4px; margin: 0 0 12px; font-size: 13px; }
aside input { min-width: 0; width: 100%; background: white; border: 1px solid #bfc6b9; border-radius: 6px; padding: 7px; }
aside form .primary { width: 100%; }
.crop-frame { position: relative; margin: 0 0 12px; }
#photo-preview { display: block; width: 100%; aspect-ratio: 5/3; }
.crop-qr { position: absolute; inset: auto auto 0 0; width: 20%; aspect-ratio: 1; background: #fff; pointer-events: none; }
.crop-status { position:absolute; right:1%; top:1.6667%; width:13.75%; height:6.6667%; display:grid; place-items:center; background:white; font-size:8px; }
.crop-controls { display: grid; gap: 2px; }
.crop-controls label { grid-template-columns: 5em minmax(0, 1fr); align-items: center; margin-bottom: 6px; }
.crop-controls input { padding: 0; accent-color: #253f36; }
#photo-size { font: 13px/1.4 "IBM Plex Mono", monospace; margin: 8px 0 12px; }
#message { margin-top: 12px; font-size: 14px; font-weight: 650; }
.sim { margin: 18px 0 0; padding-top: 14px; border-top: 1px solid #d7d9cc; display: flex; gap: 8px; flex-wrap: wrap; }
.sim button { padding: 5px 8px; font-size: 13px; }
@media (max-width: 850px) {
    .layout { grid-template-columns: 1fr; }
    main { padding: 22px 16px; }
}
</style>
</head>
<body>
<main>
<header>
    <h1>E1002 · 独立版</h1>
    <p>800 × 480 六色墨水屏交互稿</p>
</header>
<div class="layout">
    <section aria-label="设备预览">
        <div class="frame">
            <div class="screen" id="screen">
                <section id="calendar" aria-label="日历">
                    <canvas class="landscape" id="landscape" width="288" height="160" aria-hidden="true"></canvas>
                    <div class="date-summary">
                        <div class="month-heading"><span id="year"></span><span aria-hidden="true">/</span><span id="month"></span></div>
                        <strong id="today"></strong>
                        <span class="weekday-chip" id="today-weekday"></span>
                        <small id="today-lunar"></small>
                        <p class="calendar-quote">认真过好<br>每一个今天</p>
                    </div>
                    <div class="month-card">
                        <h2 class="calendar-title" id="calendar-title"></h2>
                        <div class="calendar-grid" id="days"></div>
                    </div>
                </section>
                <section id="picture" aria-label="图片" hidden>
                    <canvas id="photo" width="800" height="480" role="img" aria-label="六色图片预览"></canvas>
                </section>
                <img class="upload-qr" id="upload-qr" src="upload-qr.svg" alt="局域网上传二维码示例">
                <div class="device-statusbar" id="statusbar" data-running="false" aria-label="服务状态和电量示例">
                    <svg viewBox="0 0 28 28" aria-label="服务状态"><circle class="lamp" cx="14" cy="14" r="4"/></svg>
                    <svg viewBox="0 0 40 24" aria-label="电量"><rect x="1" y="3" width="33" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M36 8v8" stroke="currentColor" stroke-width="3"/><rect x="4" y="6" width="24" height="12" fill="currentColor"/></svg><span>86%</span>
                </div>
                <section id="setup" aria-label="首次配网" hidden>
                    <div class="setup-body">
                        <div class="setup-copy">
                            <h2>连接 Wi-Fi</h2>
                            <p>扫码加入 E1002 热点，选择家里的 Wi-Fi。</p>
                            <small>配置页未弹出时，打开 192.168.4.1</small>
                        </div>
                        <div class="setup-qr">
                            <img src="setup-qr.svg" alt="加入设备热点的二维码示例">
                            <strong>E1002-Demo</strong>
                        </div>
                    </div>
                </section>
            </div>
        </div>
        <div class="keys" aria-label="实体键模拟">
            <button id="prev" aria-label="后退">‹ 后退</button>
            <button id="mode">刷新 · 短按</button>
            <button id="wake" class="primary">刷新 · 长按</button>
            <button id="next" aria-label="前进">前进 ›</button>
        </div>
        <p class="hint" id="device-status"></p>
    </section>
    <aside aria-label="手机端预览">
        <h2>手机扫码后</h2>
        <p class="hint">二维码仅供预览。用下方按钮模拟扫码。</p>
        <button type="button" id="scan">模拟扫码</button>
        <form id="network" hidden>
            <h2>设备配网</h2>
            <label>家庭 Wi-Fi<input name="ssid" value="Home Wi-Fi" required maxlength="32"></label>
            <label>Wi-Fi 密码<input name="password" type="password" autocomplete="off" placeholder="预览可留空"></label>
            <button class="primary">连接并打开日历</button>
        </form>
        <form id="upload" hidden>
            <h2>传图到 E1002</h2>
            <p class="hint">调整 5:3 取景，确认六色预览后发送。照片会在手机上压缩。</p>
            <label>选择照片<input name="photo" type="file" accept="image/jpeg,image/png,image/webp"></label>
            <div id="crop" hidden>
                <div class="crop-frame">
                    <canvas id="photo-preview" width="800" height="480" role="img" aria-label="800 × 480 裁切及六色效果"></canvas>
                    <img class="crop-qr" src="upload-qr.svg" alt="">
                    <span class="crop-status">服务 · 电量</span>
                </div>
                <div class="crop-controls">
                    <label>缩放<input name="zoom" type="range" min="100" max="300" value="100"></label>
                    <label>水平位置<input name="horizontal" type="range" min="0" max="100" value="50"></label>
                    <label>垂直位置<input name="vertical" type="range" min="0" max="100" value="50"></label>
                </div>
                <p id="photo-size"></p>
            </div>
            <button class="primary" disabled>显示到墨水屏</button>
        </form>
        <p id="message" role="status"></p>
        <div class="sim">
            <button id="expire" disabled>模拟 5 分钟无访问</button>
            <button id="reset">模拟前进＋后退长按</button>
        </div>
    </aside>
</div>
</main>
<dialog id="device-settings" aria-labelledby="settings-title">
    <h2 id="settings-title">设备设置</h2>
    <p>实体机同时长按前进和后退约 1.5 秒进入，前后键选择，刷新键确认。</p>
    <button id="reconfigure-network">重配网络（保留照片）</button>
    <button id="factory-reset">恢复出厂（清空照片）</button>
    <button id="cancel-settings">返回画面</button>
</dialog>
<script>
const $ = id => document.getElementById(id);
const today = new Date();
const names = ["一", "二", "三", "四", "五", "六", "日"];
const lunarDate = new Intl.DateTimeFormat("zh-Hans-CN-u-ca-chinese", {
    year: "numeric", month: "long", day: "numeric", numberingSystem: "latn", timeZone: "Asia/Shanghai"
});
const lunarDays = [
    "", "初一", "初二", "初三", "初四", "初五", "初六", "初七", "初八", "初九", "初十",
    "十一", "十二", "十三", "十四", "十五", "十六", "十七", "十八", "十九", "二十",
    "廿一", "廿二", "廿三", "廿四", "廿五", "廿六", "廿七", "廿八", "廿九", "三十"
];
const WIDTH = 800;
const HEIGHT = 480;
const palette = [
    [255, 255, 255], [20, 20, 18], [172, 40, 45],
    [237, 198, 60], [50, 115, 74], [32, 67, 139]
];
const paletteIndex = new Map(palette.map(([r, g, b], index) => [(r << 16) | (g << 8) | b, index]));
const dither = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const context = $("photo").getContext("2d");
const preview = $("photo-preview").getContext("2d", { willReadFrequently: true });
const uploadForm = $("upload");
const photoInput = uploadForm.elements.photo;
const uploadButton = uploadForm.querySelector("button");
let configured = true;
let mode = "calendar";
let offset = 0;
let frames = [];
let selected = 0;
let deadline = 0;
let message = "";
let phoneView = null;
let preparedPhoto = null;
let sourcePhoto = null;
let cropTimer;
let cropRevision = 0;

function clearPhotoInput() {
    uploadForm.reset();
    clearTimeout(cropTimer);
    cropRevision++;
    sourcePhoto?.close();
    sourcePhoto = null;
    preparedPhoto = null;
    $("crop").hidden = true;
    uploadButton.disabled = true;
}

function getLunarDate(year, month, day) {
    const date = new Date(Date.UTC(year, month, day, 4));
    const parts = lunarDate.formatToParts(date);
    const lunarMonth = parts.find(part => part.type === "month").value;
    const lunarDay = Number(parts.find(part => part.type === "day").value);
    return {
        yearName: parts.find(part => part.type === "yearName")?.value,
        month: lunarMonth,
        day: lunarDays[lunarDay],
        first: lunarDay === 1
    };
}

function dayCell(text, style, current = false, lunar = null, festival = "") {
    const element = document.createElement("span");
    element.className = current ? style + " current" : style;
    const number = document.createElement("span");
    number.className = "number";
    number.textContent = text;
    if (current) element.setAttribute("aria-current", "date");
    element.append(number);
    if (lunar) {
        const subtitle = document.createElement("span");
        subtitle.className = "lunar";
        subtitle.classList.toggle("month-start", lunar.first);
        subtitle.classList.toggle("festival", Boolean(festival));
        subtitle.textContent = festival || (current ? lunar.month + lunar.day : lunar.first ? lunar.month : lunar.day);
        element.append(subtitle);
    }
    return element;
}

function drawLandscape() {
    const canvas = $("landscape").getContext("2d");
    const colors = getComputedStyle($("screen"));
    const red = colors.getPropertyValue("--red").trim();
    const blue = colors.getPropertyValue("--blue").trim();
    const yellow = colors.getPropertyValue("--yellow").trim();
    const ink = colors.getPropertyValue("--ink").trim();

    canvas.fillStyle = red;
    canvas.beginPath();
    canvas.arc(171, 39, 28, 0, Math.PI * 2);
    canvas.fill();

    function ridge(color, points) {
        canvas.fillStyle = color;
        canvas.beginPath();
        for (const [x, y] of points) canvas.lineTo(x, y);
        canvas.closePath();
        canvas.fill();
    }

    ridge(blue, [[0, 77], [31, 55], [43, 54], [71, 65], [96, 70], [125, 91],
        [147, 94], [186, 83], [207, 88], [244, 111], [288, 113], [288, 160], [0, 160]]);
    ridge(ink, [[0, 103], [23, 94], [49, 96], [86, 110], [136, 117],
        [202, 123], [288, 124], [0, 124]]);

    canvas.fillStyle = "#fff";
    for (const [x, y, width] of [[0, 125, 288], [14, 133, 270], [0, 143, 90],
        [143, 146, 145], [0, 154, 252]]) {
        canvas.fillRect(x, y, width, 2);
    }

    canvas.fillStyle = yellow;
    for (const [x, y, width] of [[154, 128, 37], [146, 137, 51],
        [162, 143, 34], [167, 150, 21], [173, 157, 8]]) {
        canvas.fillRect(x, y, width, 3);
    }

    canvas.strokeStyle = ink;
    canvas.lineWidth = 1.5;
    for (const [x, y, size] of [[212, 36, 10], [199, 58, 7], [235, 66, 8]]) {
        canvas.beginPath();
        canvas.moveTo(x - size, y - 2);
        canvas.quadraticCurveTo(x - 4, y - 2, x, y + 2);
        canvas.quadraticCurveTo(x + 4, y - 2, x + size, y - 4);
        canvas.stroke();
    }
}

const lunarFestivals = {
    "正月初一": "春节", "正月十五": "元宵节", "五月初五": "端午节",
    "七月初七": "七夕", "八月十五": "中秋节", "九月初九": "重阳节", "腊月初八": "腊八节"
};
const publicFestivals = { "1-1": "元旦", "5-1": "劳动节", "10-1": "国庆节" };

function festivalFor(date, lunar) {
    if (lunar.month === "腊月") {
        const tomorrow = getLunarDate(date.getFullYear(), date.getMonth(), date.getDate() + 1);
        if (tomorrow.month === "正月" && tomorrow.first) return "除夕";
    }
    const civilKey = date.getMonth() + 1 + "-" + date.getDate();
    return lunarFestivals[lunar.month + lunar.day] || publicFestivals[civilKey] || "";
}

function showMonth() {
    const first = new Date(today.getFullYear(), today.getMonth() + offset, 1);
    const year = first.getFullYear();
    const month = first.getMonth();
    const days = new Date(year, month + 1, 0).getDate();
    const start = (first.getDay() + 6) % 7;
    const weeks = Math.ceil((start + days) / 7);
    $("year").textContent = today.getFullYear();
    $("month").textContent = String(today.getMonth() + 1).padStart(2, "0");
    $("calendar-title").textContent = year + "年" + (month + 1) + "月";
    $("today").textContent = String(today.getDate()).padStart(2, "0");
    $("today-weekday").textContent = "星期" + names[(today.getDay() + 6) % 7];
    const todayLunar = getLunarDate(today.getFullYear(), today.getMonth(), today.getDate());
    const lunarYear = todayLunar.yearName ? todayLunar.yearName + "年 " : "";
    $("today-lunar").textContent = "农历 " + lunarYear + todayLunar.month + todayLunar.day;

    const cells = names.map((name, index) => dayCell(name, index >= 5 ? "weekday weekend" : "weekday"));
    for (let position = 0; position < weeks * 7; position++) {
        const day = position - start + 1;
        const date = new Date(year, month, day);
        const inMonth = date.getMonth() === month;
        const lunar = getLunarDate(date.getFullYear(), date.getMonth(), date.getDate());
        let style = position % 7 >= 5 ? "day weekend" : "day";
        if (!inMonth) style += " outside";
        const isToday = offset === 0 && day === today.getDate();
        cells.push(dayCell(date.getDate(), style, isToday, lunar, inMonth ? festivalFor(date, lunar) : ""));
    }
    const grid = $("days");
    grid.style.setProperty("--weeks", weeks);
    grid.replaceChildren(...cells);
}

function drawSample() {
    context.fillStyle = "#edc63c";
    context.fillRect(0, 0, 800, 480);
    context.fillStyle = "#ac282d";
    context.beginPath();
    context.arc(260, 205, 107, 0, 2 * Math.PI);
    context.fill();
    context.fillStyle = "#20438b";
    context.beginPath();
    context.moveTo(0, 411);
    context.lineTo(204, 228);
    context.lineTo(352, 380);
    context.lineTo(531, 175);
    context.lineTo(800, 382);
    context.lineTo(800, 480);
    context.lineTo(0, 480);
    context.fill();
    context.fillStyle = "#32734a";
    context.beginPath();
    context.moveTo(0, 420);
    context.quadraticCurveTo(300, 325, 490, 423);
    context.quadraticCurveTo(660, 461, 800, 361);
    context.lineTo(800, 480);
    context.lineTo(0, 480);
    context.fill();
}

function status() {
    const remaining = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
    $("statusbar").dataset.running = String(!configured || remaining > 0);
    $("upload-qr").hidden = !configured || (mode === "picture" && remaining === 0);
    if (!remaining && phoneView === "upload") {
        phoneView = null;
        clearPhotoInput();
        message = "上传服务已休眠。长按刷新键后再扫码。";
    }
    const clock = Math.floor(remaining / 60) + ":" + String(remaining % 60).padStart(2, "0");
    $("device-status").textContent = !configured ? "等待首次配网" :
        remaining ? "上传服务已开启 · " + clock + " 后休眠" : "Wi-Fi 已关闭 · 屏幕保留当前画面";
    $("expire").disabled = !remaining;
    $("network").hidden = phoneView !== "setup";
    $("upload").hidden = phoneView !== "upload";
    $("scan").hidden = phoneView !== null;
    $("message").textContent = message;
}

function render() {
    $("setup").hidden = configured;
    $("calendar").hidden = !configured || mode !== "calendar";
    $("picture").hidden = !configured || mode !== "picture";
    $("upload-qr").hidden = !configured;
    for (const id of ["prev", "next", "mode", "wake"]) $(id).disabled = !configured;
    if (configured && mode === "calendar") showMonth();
    if (configured && mode === "picture") {
        if (frames.length) context.putImageData(frames[selected], 0, 0);
        else drawSample();
    }
    status();
}

function extendSession() { deadline = Date.now() + 5 * 60 * 1000; }

function navigate(direction) {
    if (mode === "calendar") offset += direction;
    else if (frames.length) selected = Math.min(frames.length - 1, Math.max(0, selected + direction));
    render();
}

function nearestColor(r, g, b, delta) {
    const exact = paletteIndex.get((r << 16) | (g << 8) | b);
    if (exact !== undefined) return exact;
    r += delta;
    g += delta;
    b += delta;
    let best = 0;
    let bestDistance = Infinity;
    for (let index = 0; index < palette.length; index++) {
        const [red, green, blue] = palette[index];
        const distance = 2 * (r - red) ** 2 + 4 * (g - green) ** 2 + (b - blue) ** 2;
        if (distance < bestDistance) {
            bestDistance = distance;
            best = index;
        }
    }
    return best;
}

function renderCrop(bitmap, zoom, horizontal, vertical) {
    const scale = Math.max(WIDTH / bitmap.width, HEIGHT / bitmap.height) * zoom;
    const sourceWidth = Math.min(bitmap.width, WIDTH / scale);
    const sourceHeight = Math.min(bitmap.height, HEIGHT / scale);
    const sx = (bitmap.width - sourceWidth) * horizontal;
    const sy = (bitmap.height - sourceHeight) * vertical;
    preview.fillStyle = "white";
    preview.fillRect(0, 0, WIDTH, HEIGHT);
    preview.drawImage(bitmap, sx, sy, sourceWidth, sourceHeight, 0, 0, WIDTH, HEIGHT);
    const frame = preview.getImageData(0, 0, WIDTH, HEIGHT);
    const packed = new Uint8Array(WIDTH * HEIGHT / 2);
    for (let y = 0; y < HEIGHT; y++) {
        for (let x = 0; x < WIDTH; x++) {
            const pixel = y * WIDTH + x;
            const index = pixel * 4;
            const delta = (dither[(y % 4) * 4 + x % 4] - 7.5) * 5;
            const best = nearestColor(frame.data[index], frame.data[index + 1], frame.data[index + 2], delta);
            frame.data.set(palette[best], index);
            packed[pixel >> 1] |= best << (pixel % 2 === 0 ? 4 : 0);
        }
    }
    preview.putImageData(frame, 0, 0);
    return { frame, packed };
}

async function compressImage(packed) {
    if (typeof CompressionStream === "function") {
        try {
            const stream = new Blob([packed]).stream().pipeThrough(new CompressionStream("deflate"));
            const compressed = await new Response(stream).arrayBuffer();
            if (compressed.byteLength < packed.byteLength) {
                return { bytes: compressed, encoding: "deflate" };
            }
        } catch {
            // The indexed bitmap also works in browsers without a usable encoder.
        }
    }
    return { bytes: packed, encoding: "raw" };
}

function scheduleCrop() {
    if (!sourcePhoto) return;
    const revision = ++cropRevision;
    clearTimeout(cropTimer);
    preparedPhoto = null;
    uploadButton.disabled = true;
    $("photo-size").textContent = "正在处理 800 × 480 位图…";
    cropTimer = setTimeout(async () => {
        const { zoom, horizontal, vertical } = uploadForm.elements;
        const { frame, packed } = renderCrop(sourcePhoto,
            zoom.valueAsNumber / 100, horizontal.valueAsNumber / 100, vertical.valueAsNumber / 100);
        const payload = await compressImage(packed);
        if (revision !== cropRevision) return;
        preparedPhoto = { frame, payload };
        const kib = (payload.bytes.byteLength / 1024).toFixed(1);
        const encoding = payload.encoding === "deflate" ? "压缩后" : "六色位图";
        $("photo-size").textContent = "800 × 480 · " + encoding + " " + kib + " KiB";
        uploadButton.disabled = false;
    }, 75);
}

$("prev").onclick = () => navigate(-1);
$("next").onclick = () => navigate(1);
$("mode").onclick = () => {
    mode = mode === "calendar" ? "picture" : "calendar";
    render();
};
$("wake").onclick = () => {
    extendSession();
    message = "服务已开启，可以扫码上传。";
    status();
};
$("scan").onclick = () => {
    if (!configured) {
        phoneView = "setup";
        message = "";
    } else if (deadline > Date.now()) {
        extendSession();
        phoneView = "upload";
        message = "";
    } else {
        message = "请先长按刷新键开启上传。";
    }
    status();
};
$("network").onsubmit = event => {
    event.preventDefault();
    event.currentTarget.reset();
    configured = true;
    mode = "calendar";
    phoneView = null;
    extendSession();
    message = "配网完成，已打开日历。";
    render();
};
photoInput.onchange = async () => {
    const file = photoInput.files[0];
    clearTimeout(cropTimer);
    cropRevision++;
    sourcePhoto?.close();
    sourcePhoto = null;
    preparedPhoto = null;
    uploadButton.disabled = true;
    $("crop").hidden = true;
    if (!file) return;
    try {
        const bitmap = await createImageBitmap(file);
        if (photoInput.files[0] !== file || phoneView !== "upload") {
            bitmap.close();
            return;
        }
        sourcePhoto = bitmap;
        preview.clearRect(0, 0, WIDTH, HEIGHT);
        for (const name of ["zoom", "horizontal", "vertical"]) {
            const slider = uploadForm.elements[name];
            slider.value = slider.defaultValue;
        }
        $("crop").hidden = false;
        scheduleCrop();
        message = "";
    } catch {
        if (photoInput.files[0] !== file) return;
        message = "这张照片无法读取，请试试 JPEG、PNG 或 WebP。";
    }
    status();
};
for (const name of ["zoom", "horizontal", "vertical"]) {
    uploadForm.elements[name].oninput = scheduleCrop;
}
uploadForm.onsubmit = event => {
    event.preventDefault();
    if (phoneView !== "upload" || deadline <= Date.now() || !preparedPhoto) return;
    extendSession();
    frames.push(preparedPhoto.frame);
    if (frames.length > 8) frames.shift();
    selected = frames.length - 1;
    mode = "picture";
    message = "已保存到设备，正在显示最新照片。";
    clearPhotoInput();
    render();
};
$("expire").onclick = () => { deadline = 0; status(); };
$("reset").onclick = () => $("device-settings").showModal();
$("cancel-settings").onclick = () => $("device-settings").close();
function resetDemo(clearPhotos) {
    $("device-settings").close();
    configured = false;
    mode = "calendar";
    offset = 0;
    if (clearPhotos) { selected = 0; frames = []; }
    phoneView = null;
    deadline = 0;
    message = "";
    clearPhotoInput();
    render();
}
$("reconfigure-network").onclick = () => resetDemo(false);
$("factory-reset").onclick = () => {
    if (confirm("确认清除 Wi-Fi、所有照片、显示状态和上传码？")) resetDemo(true);
};
setInterval(status, 1000);
drawLandscape();
render();
</script>
</body>
</html>
