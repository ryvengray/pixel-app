[env:esp32-screen]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 460800
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  bblanchon/ArduinoJson@6.21.5
build_flags =
  -D USER_SETUP_LOADED
  -D ST7789_DRIVER
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MOSI=13
  -D TFT_MISO=12
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=27
  -D TFT_BACKLIGHT_ON=HIGH
  -D USE_HSPI_PORT
  -D SPI_FREQUENCY=20000000
  -D LOAD_GLCD
  -D LOAD_FONT2
