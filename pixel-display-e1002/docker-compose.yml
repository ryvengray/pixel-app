services:
  api:
    build: ./server
    restart: unless-stopped
    environment:
      PIXEL_TOKEN: ${PIXEL_TOKEN:?Set PIXEL_TOKEN in .env}
      MQTT_HOST: mosquitto
    ports:
      - "${API_BIND:-0.0.0.0}:8000:8000"
    volumes:
      - pixel-data:/data
    depends_on:
      - mosquitto
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "${MQTT_BIND:-0.0.0.0}:1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
volumes:
  pixel-data:
