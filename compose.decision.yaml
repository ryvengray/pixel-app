# Opt in: docker compose -f compose.yaml -f compose.decision.yaml up -d --build
services:
  pixel-decision:
    build:
      context: ./server
      dockerfile: decision/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:18081:8000"
    environment:
      MODEL_PATH: /models/bge-small-zh-v1.5
      OMP_NUM_THREADS: "4"
      ROUTE_THRESHOLD: "0.82"
      ROUTE_MARGIN: "0.08"
    volumes:
      - ./server/models/bge-small-zh-v1.5:/models/bge-small-zh-v1.5:ro
    cpus: 4.0
    mem_limit: 2g
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
  greta-service:
    environment:
      # Existing greta-service uses host networking on Ubuntu.
      DECISION_URL: http://127.0.0.1:18081
