plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}
def appVersion = new Properties()
file('version.properties').withInputStream { appVersion.load(it) }
def signing = new Properties()
def signingFile = rootProject.file('.signing/signing.properties')
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }
def signingValue = { name -> System.getenv(name) ?: signing.getProperty(name) }
def signingReady = ['RELEASE_STORE_FILE', 'RELEASE_STORE_PASSWORD', 'RELEASE_KEY_ALIAS', 'RELEASE_KEY_PASSWORD'].every { signingValue(it) }
android {
    namespace 'dev.pixel.sync'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.pixel.sync'
        minSdk 31
        targetSdk 35
        testInstrumentationRunner 'dev.pixel.sync.ToolUiInstrumentation'
        versionCode appVersion.getProperty('VERSION_CODE').toInteger()
        versionName appVersion.getProperty('VERSION_NAME')
    }
    buildFeatures { buildConfig true }
    // Same local tool schemas are used by the gateway and phone-only LLM fallback.
    sourceSets.main.assets.srcDir(rootProject.file('server/app/client_assets'))
    flavorDimensions += 'environment'
    productFlavors {
        dev {
            dimension 'environment'
            applicationIdSuffix '.dev'
            versionNameSuffix '-dev'
            buildConfigField 'boolean', 'ENABLE_FCM', 'false'
        }
        prod {
            dimension 'environment'
            buildConfigField 'boolean', 'ENABLE_FCM', 'true'
        }
    }
    signingConfigs {
        if (signingReady) {
            release {
                storeFile rootProject.file(signingValue('RELEASE_STORE_FILE'))
                storePassword signingValue('RELEASE_STORE_PASSWORD')
                keyAlias signingValue('RELEASE_KEY_ALIAS')
                keyPassword signingValue('RELEASE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (signingReady) signingConfig signingConfigs.release
        }
    }
}
dependencies {
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-messaging'
}
tasks.register('checkReleaseSigning') {
    doLast {
        if (!signingReady) throw new GradleException('Missing release signing configuration. Run scripts/New-ReleaseKey.ps1 or set RELEASE_* environment variables.')
    }
}
tasks.configureEach {
    if (name in ['preReleaseBuild', 'preProdReleaseBuild']) dependsOn 'checkReleaseSigning'
    // The development flavor intentionally has no Firebase app registration.
    // Push is disabled there so testing cannot register against production.
    if (name.startsWith('processDev') && name.endsWith('GoogleServices')) enabled = false
}
